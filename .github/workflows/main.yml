name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Proje yapısını kur
        run: |
          mkdir -p app/src/main/java/com/example/flashsync
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java SyncService.java app/src/main/java/com/example/flashsync/
          cat > settings.gradle <<'EOF'
