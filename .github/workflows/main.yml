name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Dosyalari yerlestir
        run: mkdir -p app/src/main/java/com/example/flashsync && mv AndroidManifest.xml app/src/main/ && mv MainActivity.java SyncService.java app/src/main/java/com/example/flashsync/
      - name: settings.gradle
        run: printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = 'FlashSync'\ninclude ':app'\n" > settings.gradle
      - name: build.gradle
        run: printf "plugins { id 'com.android.application' version '8.7.3' apply false }\n" > build.gradle
      - name: app/build.gradle
        run: printf "plugins { id 'com.android.application' }\nandroid {\n namespace 'com.example.flashsync'\n compileSdk 35\n defaultConfig {\n applicationId 'com.example.flashsync'\n minSdk 29\n targetSdk 35\n versionCode 1\n versionName '1.0'\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n}\n" > app/build.gradle
      - name: Derle
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlashSync-apk
          path: app/build/outputs/apk/debug/app-debug.apk
